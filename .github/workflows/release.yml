name: Build and publish Joomla update

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: joomla-release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release when the manifest version is new
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' mod_radicalmart_search.xml | head -1)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "Invalid extension version: $version" >&2; exit 1; }
          tag="v$version"
          if gh release view "$tag" --json tagName >/dev/null 2>&1; then
            echo "Release $tag already exists; no new package to publish."
            exit 0
          fi

          bash tools/build.sh
          package="dist/mod_radicalmart_search_${version}.zip"
          test -f "$package"
          checksum="$(sha256sum "$package" | cut -d' ' -f1)"
          python3 - "$version" "$checksum" "$package" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          version, checksum, package = sys.argv[1:]
          root = ET.Element("updates")
          update = ET.SubElement(root, "update")
          for tag, value in (
              ("name", "RadicalMart AJAX Search"),
              ("description", "AJAX live search module for RadicalMart"),
              ("element", "mod_radicalmart_search"),
              ("type", "module"),
              ("version", version),
              ("client", "site"),
          ):
              ET.SubElement(update, tag).text = value
          downloads = ET.SubElement(update, "downloads")
          download = ET.SubElement(downloads, "downloadurl", {"type": "full", "format": "zip"})
          download.text = f"https://github.com/shivayanamahom/radicalmart-ajax-search/releases/download/v{version}/{package.rsplit('/', 1)[-1]}"
          ET.SubElement(update, "sha256").text = checksum
          ET.indent(root, space="\t")
          ET.ElementTree(root).write("updates.xml", encoding="utf-8", xml_declaration=True)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates.xml
          if ! git diff --cached --quiet; then
            git commit -m "Publish Joomla update metadata for $tag"
            git push origin HEAD:main
          fi
          gh release create "$tag" "$package" --title "RadicalMart AJAX Search $version" --generate-notes
